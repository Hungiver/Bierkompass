<script>
        const i18n = {
            de: {
                subtitle: "Dein Kompass für Bierspezialitäten & Aktionen in Österreich",
                catTitle: "1. Bierstil / Kategorie",
                sec1: "2. Marke / Brauerei",
                selectAll: "Alle auswählen / abwählen",
                searchPlaceholder: "Suche Marke, Sorte (z.B. Gösser, Pils)...",
                dist: "Max. Entfernung",
                stores: "Geschäfte filtern",
                calTitle: "Aktionen (Nächste 14 Tage)",
                legendGreen: "Aktion aktiv",
                legendRed: "Keine Aktion",
                dateTitle: "Aktionen am"
            },
            en: {
                subtitle: "Your compass for beer deals & promotions in Austria",
                catTitle: "1. Beer Style / Category",
                sec1: "2. Brand / Brewery",
                selectAll: "Select / Deselect All",
                searchPlaceholder: "Search brand, style (e.g. Gösser, Pils)...",
                dist: "Max. Distance",
                stores: "Filter Stores",
                calTitle: "Deals (Next 14 Days)",
                legendGreen: "Deal active",
                legendRed: "No deal",
                dateTitle: "Deals on"
            }
        };

        let currentLang = 'de';

        const categories = [
            { id: 'Lager', name: 'Märzen / Lager' },
            { id: 'Pils', name: 'Pils' },
            { id: 'Weizen', name: 'Weizen / Weißbier' },
            { id: 'IPA', name: 'IPA / APA' },
            { id: 'Dunkel', name: 'Dunkel / Stout' },
            { id: 'Radler', name: 'Radler' },
            { id: 'Alkoholfrei', name: 'Alkoholfrei' }
        ];
        let activeCategory = 'Lager';

        const allBeers = [
            { id: 'Gösser', name: 'Gösser', style: 'Lager', icon: '🍺' },
            { id: 'Zipfer', name: 'Zipfer', style: 'Pils', icon: '🍺' },
            { id: 'Stiegl', name: 'Stiegl', style: 'Lager', icon: '🍺' },
            { id: 'Puntigamer', name: 'Puntigamer', style: 'Lager', icon: '🍺' },
            { id: 'Murauer', name: 'Murauer', style: 'Lager', icon: '🍺' },
            { id: 'Ottakringer', name: 'Ottakringer', style: 'Lager', icon: '🍺' },
            { id: 'Wieselburger', name: 'Wieselburger', style: 'Lager', icon: '🍺' },
            { id: 'Schwechater', name: 'Schwechater', style: 'Lager', icon: '🍺' },
            { id: 'Schneider', name: 'Schneider Weisse', style: 'Weizen', icon: '🌾' },
            { id: 'Franziskaner', name: 'Franziskaner', style: 'Weizen', icon: '🌾' },
            { id: 'BrewDog', name: 'BrewDog Punk IPA', style: 'IPA', icon: '🌿' },
            { id: 'Hirter', name: 'Hirter Dunkel', style: 'Dunkel', icon: '🍻' },
            { id: 'GoesserRadler', name: 'Gösser NaturRadler', style: 'Radler', icon: '🍋' },
            { id: 'ZipferRadler', name: 'Zipfer Limetten-Radler', style: 'Radler', icon: '🍋' },
            { id: 'StieglRadler', name: 'Stiegl-Radler Zitrone', style: 'Radler', icon: '🍋' },
            { id: 'GössaAF', name: 'Gösser Naturtrüb 0.0', style: 'Alkoholfrei', icon: '🛑' }
        ];

        const storesList = ['SPAR', 'EUROSPAR', 'INTERSPAR', 'BILLA', 'BILLA Plus', 'HOFER', 'LIDL', 'PENNY', 'METRO'];
        let activeStores = [...storesList];
        let selectedBeers = allBeers.map(b => b.id);

        function getFormattedDate(offset) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            return d.toISOString().split('T')[0];
        }

        let sampleDeals = [];

        async function loadDealsData() {
            try {
                const res = await fetch('deals.json');
                if (res.ok) {
                    sampleDeals = await res.json();
                } else {
                    generateSampleDeals();
                }
            } catch (e) {
                generateSampleDeals();
            }
            renderCalendar();
        }

        function generateSampleDeals() {
            sampleDeals = [];
            for (let i = 0; i < 8; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'METRO', distance: 8.5, beer: 'Stiegl', name: 'Stiegl Goldbräu 20x0.5L Kiste', price: '14.90 €', origPrice: '19.90 €', note: 'Kistenpreis' });
            }
            for (let i = 2; i < 7; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'HOFER', distance: 3.1, beer: 'Puntigamer', name: 'Puntigamer das Bier 0.5L Dose', price: '0.69 €', origPrice: '1.19 €', note: 'Wochenend-Aktion' });
            }
            for (let i = 0; i < 7; i++) {
                const isWeekend = (i === 2 || i === 3 || i === 9 || i === 10);
                sampleDeals.push({
                    date: getFormattedDate(i),
                    store: 'BILLA Plus',
                    distance: 2.1,
                    beer: 'Puntigamer',
                    name: 'Puntigamer Märzen 0.5L Dose',
                    price: isWeekend ? '0.74 €' : '0.99 €',
                    origPrice: isWeekend ? '1.16 €' : '1.54 €',
                    note: isWeekend ? 'Ab 12 Dosen (Fr-Sa Bonus)' : 'Ab 12 Dosen (Do/Mo-Mi)'
                });
            }
            for (let i = 0; i < 5; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'INTERSPAR', distance: 4.5, beer: 'Gösser', name: 'Gösser Märzen 20x0.5L Flasche', price: '13.80 €', origPrice: '21.80 €', note: 'Exklusiv bei INTERSPAR' });
            }
            for (let i = 1; i < 6; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'SPAR', distance: 1.8, beer: 'GoesserRadler', name: 'Gösser NaturRadler 0.5L Dose', price: '0.89 €', origPrice: '1.29 €', note: 'Aktion' });
            }
            for (let i = 0; i < 6; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'PENNY', distance: 2.5, beer: 'Wieselburger', name: 'Wieselburger Gold 0.5L Flasche', price: '0.79 €', origPrice: '1.19 €', note: 'Aktion' });
            }
            for (let i = 3; i < 8; i++) {
                sampleDeals.push({ date: getFormattedDate(i), store: 'BILLA', distance: 1.5, beer: 'Schwechater', name: 'Schwechater Bier 0.5L Dose', price: '0.65 €', origPrice: '0.99 €', note: 'Dosen-Aktion' });
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoryPills');
            container.innerHTML = '';
            categories.forEach(cat => {
                const isActive = activeCategory === cat.id;
                container.innerHTML += `
                    <button onclick="setCategory('${cat.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${isActive ? 'bg-amber-500 text-slate-950 border-amber-500 shadow-md shadow-amber-500/20' : 'bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500'}">
                        ${cat.name}
                    </button>
                `;
            });
        }

        function setCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderBeerTiles();
            renderCalendar();
        }

        function renderBeerTiles() {
            const grid = document.getElementById('beerGrid');
            grid.innerHTML = '';
            const filtered = allBeers.filter(b => b.style === activeCategory);
            filtered.forEach(b => {
                const isSel = selectedBeers.includes(b.id);
                grid.innerHTML += `
                    <button onclick="toggleBeer('${b.id}')" id="tile-${b.id}" class="p-2.5 rounded-xl border text-center transition flex flex-col items-center justify-center h-20 ${isSel ? 'border-amber-500 bg-amber-500/10 text-white font-bold shadow-md shadow-amber-500/10' : 'border-slate-700 bg-slate-900/60 text-slate-500 hover:border-slate-500'}">
                        <span class="text-2xl mb-1">${b.icon}</span>
                        <span class="text-xs font-semibold">${b.name}</span>
                    </button>
                `;
            });
        }

        function filterBeerTiles() {
            const query = document.getElementById('beerSearch').value.toLowerCase();
            allBeers.forEach(b => {
                const tile = document.getElementById(`tile-${b.id}`);
                if (tile) {
                    const match = b.name.toLowerCase().includes(query) || b.style.toLowerCase().includes(query);
                    tile.style.display = match ? 'flex' : 'none';
                }
            });
        }

        function toggleBeer(id) {
            if (selectedBeers.includes(id)) {
                selectedBeers = selectedBeers.filter(b => b !== id);
            } else {
                selectedBeers.push(id);
            }
            renderBeerTiles();
            renderCalendar();
        }

        function selectAllBeers() {
            const currentCategoryBeerIds = allBeers.filter(b => b.style === activeCategory).map(b => b.id);
            const allSelected = currentCategoryBeerIds.every(id => selectedBeers.includes(id));
            
            if (allSelected) {
                selectedBeers = selectedBeers.filter(id => !currentCategoryBeerIds.includes(id));
            } else {
                selectedBeers = Array.from(new Set([...selectedBeers, ...currentCategoryBeerIds]));
            }
            renderBeerTiles();
            renderCalendar();
        }

        function renderStorePills() {
            const container = document.getElementById('storePills');
            container.innerHTML = '';
            storesList.forEach(store => {
                const isOn = activeStores.includes(store);
                container.innerHTML += `
                    <button onclick="toggleStore('${store}')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${isOn ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-900 text-slate-500 border-slate-700 line-through'}">
                        ${isOn ? '✓' : '✗'} ${store}
                    </button>
                `;
            });
        }

        function toggleStore(store) {
            if (activeStores.includes(store)) {
                activeStores = activeStores.filter(s => s !== store);
            } else {
                activeStores.push(store);
            }
            renderStorePills();
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const maxDist = parseFloat(document.getElementById('distRange').value);
            grid.innerHTML = '';

            for (let i = 0; i < 14; i++) {
                const dateStr = getFormattedDate(i);
                const dObj = new Date();
                dObj.setDate(dObj.getDate() + i);

                const dayName = dObj.toLocaleDateString(currentLang === 'de' ? 'de-DE' : 'en-US', { weekday: 'short' });
                const monthDay = dObj.toLocaleDateString(currentLang === 'de' ? 'de-DE' : 'en-US', { day: '2-digit', month: 'short' });

                const activeDeals = sampleDeals.filter(d => 
                    d.date === dateStr && 
                    selectedBeers.includes(d.beer) && 
                    d.distance <= maxDist &&
                    activeStores.includes(d.store)
                );

                const hasDeal = activeDeals.length > 0;
                const bg = hasDeal 
                    ? 'bg-green-600 text-white font-bold cursor-pointer hover:bg-green-500 shadow-lg shadow-green-950/50' 
                    : 'bg-slate-900/80 text-slate-600 border border-slate-800';

                grid.innerHTML += `
                    <div onclick="${hasDeal ? `showDetails('${dateStr}')` : ''}" class="${bg} p-2 rounded-xl transition flex flex-col items-center justify-center h-14 relative">
                        <span class="text-[10px] uppercase opacity-80">${dayName}</span>
                        <span class="text-xs font-extrabold">${monthDay}</span>
                        ${hasDeal ? `<span class="absolute top-1 right-1 bg-green-950 text-green-300 text-[9px] px-1.5 py-0.2 rounded-full font-bold">${activeDeals.length}</span>` : ''}
                    </div>
                `;
            }
        }

        function showDetails(dateStr) {
            const maxDist = parseFloat(document.getElementById('distRange').value);
            const section = document.getElementById('detailsSection');
            const list = document.getElementById('dealsList');
            
            document.getElementById('selectedDateTitle').innerText = `${i18n[currentLang].dateTitle} ${dateStr}`;
            list.innerHTML = '';

            const deals = sampleDeals.filter(d => 
                d.date === dateStr && 
                selectedBeers.includes(d.beer) && 
                d.distance <= maxDist &&
                activeStores.includes(d.store)
            );

            deals.forEach(d => {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.store)}`;
                list.innerHTML += `
                    <div class="border border-slate-700 rounded-xl p-4 flex justify-between items-center bg-slate-900/60">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-bold uppercase hover:bg-amber-500 hover:text-slate-950 transition flex items-center gap-1">
                                    📍 ${d.store} (${d.distance} km) ↗
                                </a>
                            </div>
                            <h4 class="font-bold text-base mt-1.5 text-slate-100">${d.name}</h4>
                            ${d.note ? `<p class="text-xs text-amber-400/90 mt-0.5">ℹ️ ${d.note}</p>` : ''}
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-extrabold text-green-400">${d.price}</span>
                            ${d.origPrice ? `<span class="text-xs text-slate-500 line-through block">${d.origPrice}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            section.classList.remove('hidden');
            section.scrollIntoView({ behavior: 'smooth' });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-de').className = lang === 'de' ? "px-3 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-900 transition" : "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
            document.getElementById('btn-en').className = lang === 'en' ? "px-3 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-900 transition" : "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
            
            document.getElementById('txt-subtitle').innerText = i18n[lang].subtitle;
            document.getElementById('txt-cat-title').innerText = i18n[lang].catTitle;
            document.getElementById('txt-sec1').innerText = i18n[lang].sec1;
            document.getElementById('txt-select-all').innerText = i18n[lang].selectAll;
            document.getElementById('beerSearch').placeholder = i18n[lang].searchPlaceholder;
            document.getElementById('txt-dist').innerText = i18n[lang].dist;
            document.getElementById('txt-stores').innerText = i18n[lang].stores;
            document.getElementById('txt-cal-title').innerText = i18n[lang].calTitle;
            document.getElementById('txt-legend-green').innerText = i18n[lang].legendGreen;
            document.getElementById('txt-legend-red').innerText = i18n[lang].legendRed;

            renderCalendar();
        }

        renderCategories();
        renderBeerTiles();
        renderStorePills();
        loadDealsData();
        setLanguage('de');
</script>
