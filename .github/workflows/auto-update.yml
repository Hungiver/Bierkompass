name: Auto Update Beer Deals

on:
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo klonozasa
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Adatgyujto szkript futtatasa
        run: python scraper.py

      - name: Valtoztatasok mentese
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "Auto-update deals.json" || exit 0
          git push
